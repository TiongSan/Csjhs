<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>數字描寫練習 (無提示點、車車反彈版)</title>
        <style>
            body {
                font-family: "Microsoft JhengHei", sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                background-color: #f4f4f9;
                margin: 0;
                padding: 20px;
                overflow-x: hidden;
                overflow-y: hidden;
            }
            h1 {
                color: #333;
                margin-bottom: 5px;
            }
            #message {
                font-size: 20px;
                font-weight: bold;
                color: #ff9800;
                margin-bottom: 15px;
                height: 28px;
            }
            .controls {
                margin-bottom: 15px;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
                max-width: 400px;
                z-index: 10;
            }
            .num-btn {
                padding: 10px 15px;
                font-size: 18px;
                cursor: pointer;
                border: 2px solid #4caf50;
                background-color: white;
                color: #4caf50;
                border-radius: 8px;
            }
            .num-btn.active,
            .num-btn:hover {
                background-color: #4caf50;
                color: white;
            }
            #canvas-container {
                position: relative;
                background-color: white;
                border: 3px solid #666;
                border-radius: 10px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                z-index: 10;
            }
            canvas {
                touch-action: none;
                cursor: crosshair;
            }
            .btn-group {
                display: flex;
                gap: 10px;
                z-index: 10;
            }
            .action-btn {
                margin-top: 15px;
                padding: 12px 24px;
                font-size: 18px;
                cursor: pointer;
                border: none;
                background-color: #ff5722;
                color: white;
                border-radius: 8px;
            }
            #soundToggle {
                background-color: #9c27b0;
            }

            /* 🎈 氣球樣式 */
            .balloon {
                position: fixed;
                bottom: -100px;
                width: 60px;
                height: 80px;
                border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
                cursor: pointer;
                box-shadow: inset -5px -5px 10px rgba(0, 0, 0, 0.2);
                animation: floatUp linear forwards;
                z-index: 100;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 40px;
                user-select: none;
                touch-action: manipulation;
            }
            .balloon::after {
                content: "";
                position: absolute;
                bottom: -10px;
                left: 50%;
                transform: translateX(-50%);
                border-left: 6px solid transparent;
                border-right: 6px solid transparent;
                border-bottom: 10px solid currentColor;
            }
            @keyframes floatUp {
                0% {
                    transform: translateY(0) translateX(0);
                }
                50% {
                    transform: translateY(-50vh) translateX(20px);
                }
                100% {
                    transform: translateY(-110vh) translateX(-20px);
                }
            }
            .balloon.popped::after {
                display: none;
            }

            /* 🚗 車子樣式 (移除了 CSS 動畫，改由 JS 控制) */
            .car {
                position: fixed;
                font-size: 50px;
                z-index: 90;
                user-select: none;
                pointer-events: none;
                white-space: nowrap;
            }
        </style>
    </head>
    <body>
        <h1>數字練習板</h1>
        <div id="message">請點擊紫色按鈕開啟音效！</div>

        <div class="controls" id="number-selector"></div>

        <div id="canvas-container">
            <canvas id="drawingBoard" width="300" height="300"></canvas>
        </div>

        <div class="btn-group">
            <button class="action-btn" id="clearBtn">清除重寫</button>
            <button class="action-btn" id="soundToggle">🔇 開啟音效</button>
        </div>

        <script>
            const canvas = document.getElementById("drawingBoard");
            const ctx = canvas.getContext("2d");
            const clearBtn = document.getElementById("clearBtn");
            const numberSelector = document.getElementById("number-selector");
            const messageEl = document.getElementById("message");
            const soundToggle = document.getElementById("soundToggle");

            let isDrawing = false;
            let currentNumber = "1";
            let currentCheckpointIndex = 0;
            let isFinished = false;

            let audioCtx;
            let isSoundEnabled = false;

            const checkpointsData = {
                0: [
                    { x: 150, y: 70 },
                    { x: 80, y: 150 },
                    { x: 150, y: 250 },
                    { x: 220, y: 150 },
                    { x: 150, y: 70 },
                ],
                1: [
                    { x: 150, y: 70 },
                    { x: 150, y: 250 },
                ],
                2: [
                    { x: 90, y: 90 },
                    { x: 150, y: 70 },
                    { x: 200, y: 100 },
                    { x: 90, y: 240 },
                    { x: 210, y: 240 },
                ],
                3: [
                    { x: 100, y: 80 },
                    { x: 200, y: 80 },
                    { x: 150, y: 145 },
                    { x: 210, y: 210 },
                    { x: 100, y: 240 },
                ],
                4: [
                    { x: 180, y: 70 },
                    { x: 80, y: 180 },
                    { x: 220, y: 180 },
                    { x: 180, y: 100 },
                    { x: 180, y: 250 },
                ],
                5: [
                    { x: 200, y: 70 },
                    { x: 100, y: 70 },
                    { x: 100, y: 140 },
                    { x: 210, y: 180 },
                    { x: 100, y: 240 },
                ],
                6: [
                    { x: 180, y: 70 },
                    { x: 110, y: 160 },
                    { x: 130, y: 250 },
                    { x: 190, y: 200 },
                    { x: 130, y: 160 },
                ],
                7: [
                    { x: 90, y: 80 },
                    { x: 210, y: 80 },
                    { x: 150, y: 240 },
                ],
                8: [
                    { x: 150, y: 70 },
                    { x: 100, y: 110 },
                    { x: 150, y: 160 },
                    { x: 190, y: 210 },
                    { x: 150, y: 250 },
                    { x: 100, y: 210 },
                    { x: 150, y: 160 },
                    { x: 190, y: 110 },
                    { x: 150, y: 70 },
                ],
                9: [
                    { x: 180, y: 100 },
                    { x: 150, y: 70 },
                    { x: 110, y: 120 },
                    { x: 150, y: 160 },
                    { x: 180, y: 100 },
                    { x: 180, y: 240 },
                ],
            };

            // --- 音效區 ---
            function playPopSound() {
                if (!audioCtx || !isSoundEnabled) return;
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.type = "sine";
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(
                    40,
                    audioCtx.currentTime + 0.1,
                );
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(
                    0.01,
                    audioCtx.currentTime + 0.1,
                );
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            }

            function playSuccessSound() {
                if (!audioCtx || !isSoundEnabled) return;
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.type = "triangle";
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(
                    554.37,
                    audioCtx.currentTime + 0.15,
                );
                osc.frequency.setValueAtTime(
                    659.25,
                    audioCtx.currentTime + 0.3,
                );
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(
                    0.5,
                    audioCtx.currentTime + 0.05,
                );
                gainNode.gain.linearRampToValueAtTime(
                    0,
                    audioCtx.currentTime + 0.6,
                );
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            }

            soundToggle.addEventListener("click", () => {
                if (!audioCtx) {
                    audioCtx = new (
                        window.AudioContext || window.webkitAudioContext
                    )();
                }
                if (audioCtx.state === "suspended") {
                    audioCtx.resume();
                }
                isSoundEnabled = !isSoundEnabled;
                if (isSoundEnabled) {
                    soundToggle.innerText = "🔊 關閉音效";
                    messageEl.innerText = "音效已啟動，開始練習吧！";
                } else {
                    soundToggle.innerText = "🔇 開啟音效";
                    messageEl.innerText = "音效已關閉，可以開始練習！";
                }
            });

            // --- 核心邏輯區 ---
            function init() {
                for (let i = 0; i <= 9; i++) {
                    const btn = document.createElement("button");
                    btn.className = "num-btn";
                    btn.innerText = i;
                    if (i.toString() === currentNumber)
                        btn.classList.add("active");

                    btn.addEventListener("click", () => {
                        document
                            .querySelectorAll(".num-btn")
                            .forEach((b) => b.classList.remove("active"));
                        btn.classList.add("active");
                        currentNumber = i.toString();
                        resetGame();
                    });
                    numberSelector.appendChild(btn);
                }
                resetGame();
                setupEvents();
            }

            function resetGame() {
                currentCheckpointIndex = 0;
                isFinished = false;
                if (isSoundEnabled) {
                    messageEl.innerText = "請憑記憶寫出正確的筆順！";
                } else {
                    messageEl.innerText = "請點擊紫色按鈕開啟音效！";
                }
                messageEl.style.color = "#ff9800";
                drawBackground();
            }

            function drawBackground() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = "#e0e0e0";
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 10]);
                ctx.beginPath();
                ctx.moveTo(150, 0);
                ctx.lineTo(150, 300);
                ctx.moveTo(0, 150);
                ctx.lineTo(300, 150);
                ctx.stroke();

                ctx.setLineDash([]);
                ctx.font = "bold 220px Arial";
                ctx.fillStyle = "#f0f0f0";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(currentNumber, 150, 165);

                // ⛔ 這裡註解掉了畫藍色與橘色點點的程式碼
                /*
            const points = checkpointsData[currentNumber];
            points.forEach((p, index) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = (index === 0) ? '#ff5722' : '#2196F3';
                ctx.fill();
            });
            */
            }

            function getCoordinates(event) {
                const rect = canvas.getBoundingClientRect();
                let x, y;
                if (event.touches && event.touches.length > 0) {
                    x = event.touches[0].clientX - rect.left;
                    y = event.touches[0].clientY - rect.top;
                } else {
                    x = event.clientX - rect.left;
                    y = event.clientY - rect.top;
                }
                return { x, y };
            }

            function startPosition(e) {
                if (isFinished) return;
                isDrawing = true;
                ctx.beginPath();
                const { x, y } = getCoordinates(e);
                ctx.moveTo(x, y);
                draw(e);
            }

            function endPosition() {
                isDrawing = false;
            }

            function draw(e) {
                if (!isDrawing || isFinished) return;
                e.preventDefault();

                const { x, y } = getCoordinates(e);
                ctx.lineWidth = 15;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.strokeStyle = "#333";

                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);

                checkProgress(x, y);
            }

            function checkProgress(x, y) {
                const points = checkpointsData[currentNumber];
                if (currentCheckpointIndex >= points.length) return;

                const target = points[currentCheckpointIndex];
                const distance = Math.hypot(x - target.x, y - target.y);

                if (distance < 40) {
                    currentCheckpointIndex++;

                    if (
                        currentCheckpointIndex === points.length &&
                        !isFinished
                    ) {
                        isFinished = true;
                        messageEl.innerText = "🎉 太棒了！方向全對！";
                        messageEl.style.color = "#4CAF50";

                        playSuccessSound();
                        showBalloons();
                        showCars();
                    }
                }
            }

            // 🎈 氣球特效
            function showBalloons() {
                const colors = [
                    "#F44336",
                    "#E91E63",
                    "#9C27B0",
                    "#673AB7",
                    "#3F51B5",
                    "#2196F3",
                    "#03A9F4",
                    "#00BCD4",
                    "#009688",
                    "#4CAF50",
                    "#8BC34A",
                    "#CDDC39",
                    "#FFEB3B",
                    "#FFC107",
                    "#FF9800",
                    "#FF5722",
                ];

                for (let i = 0; i < 20; i++) {
                    setTimeout(() => {
                        const balloon = document.createElement("div");
                        balloon.className = "balloon";
                        const color =
                            colors[Math.floor(Math.random() * colors.length)];
                        balloon.style.backgroundColor = color;
                        balloon.style.color = color;
                        balloon.style.left = Math.random() * 80 + 10 + "vw";

                        const duration = 3 + Math.random() * 3;
                        balloon.style.animationDuration = duration + "s";

                        const pop = (e) => {
                            e.preventDefault();
                            if (balloon.classList.contains("popped")) return;
                            balloon.classList.add("popped");
                            balloon.innerText = "💥";
                            balloon.style.backgroundColor = "transparent";
                            balloon.style.boxShadow = "none";
                            playPopSound();
                            setTimeout(() => balloon.remove(), 300);
                        };

                        balloon.addEventListener("mousedown", pop);
                        balloon.addEventListener("touchstart", pop, {
                            passive: false,
                        });
                        document.body.appendChild(balloon);

                        setTimeout(() => {
                            if (document.body.contains(balloon)) {
                                balloon.remove();
                            }
                        }, duration * 1000);
                    }, Math.random() * 2000);
                }
            }

            // 🚗 底部車子物理碰撞動畫特效
            function showCars() {
                const carEmojis = [
                    "🚗",
                    "🚕",
                    "🚙",
                    "🚓",
                    "🚒",
                    "🚑",
                    "🚜",
                    "🛵",
                ];
                const numCars = 6;
                const cars = [];

                for (let i = 0; i < numCars; i++) {
                    const carEl = document.createElement("div");
                    carEl.className = "car";
                    carEl.innerText =
                        carEmojis[Math.floor(Math.random() * carEmojis.length)];

                    // 隨機決定起始方向與速度
                    let isMovingRight = Math.random() > 0.5;
                    let speed = 2 + Math.random() * 3; // 每幀移動像素
                    let vx = isMovingRight ? speed : -speed;

                    // 隨機初始位置 (確保在螢幕內)
                    let x = Math.random() * (window.innerWidth - 60);
                    let bottomPos = 10 + Math.random() * 40;

                    carEl.style.left = x + "px";
                    carEl.style.bottom = bottomPos + "px";
                    carEl.style.transform = vx > 0 ? "scaleX(-1)" : "scaleX(1)";

                    document.body.appendChild(carEl);

                    // 將車子的狀態存入陣列，供迴圈使用
                    cars.push({ el: carEl, x: x, vx: vx, width: 50 });
                }

                let animationId;
                let startTime = Date.now();
                const bounceDuration = 8000; // 在畫面內來回反彈 8 秒

                // 動畫迴圈函數
                function animateCars() {
                    const now = Date.now();
                    const isBouncing = now - startTime < bounceDuration;
                    let allOffScreen = true; // 預設所有車都開走了

                    cars.forEach((car) => {
                        // 更新位置
                        car.x += car.vx;

                        if (isBouncing) {
                            // 【來回反彈模式】
                            if (car.x <= 0) {
                                car.x = 0;
                                car.vx = Math.abs(car.vx); // 改向右開
                                car.el.style.transform = "scaleX(-1)";
                            } else if (car.x >= window.innerWidth - car.width) {
                                car.x = window.innerWidth - car.width;
                                car.vx = -Math.abs(car.vx); // 改向左開
                                car.el.style.transform = "scaleX(1)";
                            }
                            allOffScreen = false; // 車子還在畫面上
                        } else {
                            // 【時間到，放行模式】讓車子順勢開出螢幕
                            if (
                                car.x > -100 &&
                                car.x < window.innerWidth + 100
                            ) {
                                allOffScreen = false; // 還沒完全開出畫面
                            }
                        }

                        // 將計算好的位置套用到畫面上
                        car.el.style.left = car.x + "px";
                    });

                    // 判斷是否結束動畫
                    if (allOffScreen) {
                        cars.forEach((car) => {
                            if (document.body.contains(car.el)) car.el.remove();
                        });
                        cancelAnimationFrame(animationId);
                    } else {
                        // 呼叫下一幀
                        animationId = requestAnimationFrame(animateCars);
                    }
                }

                // 啟動迴圈
                animateCars();
            }

            function setupEvents() {
                canvas.addEventListener("mousedown", startPosition);
                canvas.addEventListener("mouseup", endPosition);
                canvas.addEventListener("mousemove", draw);
                canvas.addEventListener("mouseout", endPosition);

                canvas.addEventListener("touchstart", startPosition, {
                    passive: false,
                });
                canvas.addEventListener("touchend", endPosition);
                canvas.addEventListener("touchmove", draw, { passive: false });

                clearBtn.addEventListener("click", resetGame);
            }

            init();
        </script>
    </body>
</html>
