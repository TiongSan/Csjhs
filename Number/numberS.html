<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數字描寫練習 (氣球、車車與音效版)</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            overflow-x: hidden; 
            overflow-y: hidden; /* 防止底部車子造成垂直捲動 */
        }
        h1 { color: #333; margin-bottom: 5px; }
        #message {
            font-size: 20px;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 15px;
            height: 28px;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 400px;
            z-index: 10;
        }
        .num-btn {
            padding: 10px 15px;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid #4CAF50;
            background-color: white;
            color: #4CAF50;
            border-radius: 8px;
        }
        .num-btn.active, .num-btn:hover {
            background-color: #4CAF50;
            color: white;
        }
        #canvas-container {
            position: relative;
            background-color: white;
            border: 3px solid #666;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 10;
        }
        canvas {
            touch-action: none; 
            cursor: crosshair;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .action-btn {
            margin-top: 15px;
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background-color: #ff5722;
            color: white;
            border-radius: 8px;
        }
        #soundToggle {
            background-color: #9C27B0;
        }
        
        /* 🎈 氣球樣式 */
        .balloon {
            position: fixed;
            bottom: -100px;
            width: 60px;
            height: 80px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; 
            cursor: pointer;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2);
            animation: floatUp linear forwards;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            user-select: none;
            touch-action: manipulation;
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 10px solid currentColor;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-50vh) translateX(20px); }
            100% { transform: translateY(-110vh) translateX(-20px); }
        }
        .balloon.popped::after {
            display: none;
        }

        /* 🚗 車子樣式與動畫 */
        .car {
            position: fixed;
            font-size: 50px; /* 車子的大小 */
            z-index: 90; /* 在背景之上，氣球之下 */
            user-select: none;
            pointer-events: none; /* 讓車子不會干擾點擊操作 */
            white-space: nowrap;
            /* 動畫由 JS 動態指定 */
        }
        /* 從左開到右 */
        @keyframes driveRight {
            0% { left: -100px; }
            100% { left: 100vw; }
        }
        /* 從右開到左 */
        @keyframes driveLeft {
            0% { left: 100vw; }
            100% { left: -100px; }
        }
    </style>
</head>
<body>

    <h1>數字練習板</h1>
    <div id="message">請點擊紫色按鈕開啟音效！</div>
    
    <div class="controls" id="number-selector"></div>

    <div id="canvas-container">
        <canvas id="drawingBoard" width="300" height="300"></canvas>
    </div>

    <div class="btn-group">
        <button class="action-btn" id="clearBtn">清除重寫</button>
        <button class="action-btn" id="soundToggle">🔇 開啟音效</button>
    </div>

    <script>
        const canvas = document.getElementById('drawingBoard');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const numberSelector = document.getElementById('number-selector');
        const messageEl = document.getElementById('message');
        const soundToggle = document.getElementById('soundToggle');
        
        let isDrawing = false;
        let currentNumber = '1';
        let currentCheckpointIndex = 0;
        let isFinished = false;

        let audioCtx;
        let isSoundEnabled = false;

        const checkpointsData = {
            '0': [{x:150, y:70}, {x:80, y:150}, {x:150, y:250}, {x:220, y:150}, {x:150, y:70}],
            '1': [{x:150, y:70}, {x:150, y:250}],
            '2': [{x:90, y:90}, {x:150, y:70}, {x:200, y:100}, {x:90, y:240}, {x:210, y:240}],
            '3': [{x:100, y:80}, {x:200, y:80}, {x:150, y:145}, {x:210, y:210}, {x:100, y:240}],
            '4': [{x:180, y:70}, {x:80, y:180}, {x:220, y:180}, {x:180, y:100}, {x:180, y:250}],
            '5': [{x:200, y:70}, {x:100, y:70}, {x:100, y:140}, {x:210, y:180}, {x:100, y:240}],
            '6': [{x:180, y:70}, {x:110, y:160}, {x:130, y:250}, {x:190, y:200}, {x:130, y:160}],
            '7': [{x:90, y:80}, {x:210, y:80}, {x:150, y:240}],
            '8': [{x:150, y:70}, {x:100, y:110}, {x:150, y:160}, {x:190, y:210}, {x:150, y:250}, {x:100, y:210}, {x:150, y:160}, {x:190, y:110}, {x:150, y:70}],
            '9': [{x:180, y:100}, {x:150, y:70}, {x:110, y:120}, {x:150, y:160}, {x:180, y:100}, {x:180, y:240}]
        };

        // --- 音效區 ---
        function playPopSound() {
            if (!audioCtx || !isSoundEnabled) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSuccessSound() {
            if (!audioCtx || !isSoundEnabled) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.15);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        soundToggle.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isSoundEnabled = !isSoundEnabled;
            if (isSoundEnabled) {
                soundToggle.innerText = "🔊 關閉音效";
                messageEl.innerText = "音效已啟動，開始練習吧！";
            } else {
                soundToggle.innerText = "🔇 開啟音效";
                messageEl.innerText = "音效已關閉，請依照藍點練習！";
            }
        });

        // --- 核心邏輯區 ---
        function init() {
            for (let i = 0; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.innerText = i;
                if (i.toString() === currentNumber) btn.classList.add('active');
                
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentNumber = i.toString();
                    resetGame();
                });
                numberSelector.appendChild(btn);
            }
            resetGame();
            setupEvents();
        }

        function resetGame() {
            currentCheckpointIndex = 0;
            isFinished = false; 
            if (isSoundEnabled) {
                messageEl.innerText = "請按照藍色點點的順序寫！";
            } else {
                messageEl.innerText = "請點擊紫色按鈕開啟音效！";
            }
            messageEl.style.color = "#ff9800";
            drawBackground();
        }

        function drawBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(150, 0); ctx.lineTo(150, 300);
            ctx.moveTo(0, 150); ctx.lineTo(300, 150);
            ctx.stroke();

            ctx.setLineDash([]);
            ctx.font = 'bold 220px Arial';
            ctx.fillStyle = '#f0f0f0';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(currentNumber, 150, 165);

            const points = checkpointsData[currentNumber];
            points.forEach((p, index) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = (index === 0) ? '#ff5722' : '#2196F3';
                ctx.fill();
            });
        }

        function getCoordinates(event) {
            const rect = canvas.getBoundingClientRect();
            let x, y;
            if (event.touches && event.touches.length > 0) {
                x = event.touches[0].clientX - rect.left;
                y = event.touches[0].clientY - rect.top;
            } else {
                x = event.clientX - rect.left;
                y = event.clientY - rect.top;
            }
            return { x, y };
        }

        function startPosition(e) {
            if (isFinished) return;
            isDrawing = true;
            ctx.beginPath(); 
            const { x, y } = getCoordinates(e);
            ctx.moveTo(x, y); 
            draw(e);
        }

        function endPosition() {
            isDrawing = false;
        }

        function draw(e) {
            if (!isDrawing || isFinished) return;
            e.preventDefault(); 
            
            const { x, y } = getCoordinates(e);
            ctx.lineWidth = 15; 
            ctx.lineCap = 'round'; 
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#333'; 

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);

            checkProgress(x, y);
        }

        function checkProgress(x, y) {
            const points = checkpointsData[currentNumber];
            if (currentCheckpointIndex >= points.length) return;

            const target = points[currentCheckpointIndex];
            const distance = Math.hypot(x - target.x, y - target.y);

            if (distance < 40) {
                currentCheckpointIndex++;
                
                if (currentCheckpointIndex === points.length && !isFinished) {
                    isFinished = true;
                    messageEl.innerText = "🎉 太棒了！寫對了！";
                    messageEl.style.color = "#4CAF50";
                    
                    playSuccessSound();
                    showBalloons();
                    showCars(); // 🚗 呼叫產生車子的函數
                }
            }
        }

        // 🎈 氣球特效
        function showBalloons() {
            const colors = ['#F44336', '#E91E63', '#9C27B0', '#673AB7', '#3F51B5', '#2196F3', '#03A9F4', '#00BCD4', '#009688', '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800', '#FF5722'];
            
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon';
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    balloon.style.backgroundColor = color;
                    balloon.style.color = color; 
                    balloon.style.left = Math.random() * 80 + 10 + 'vw';
                    
                    const duration = 3 + Math.random() * 3;
                    balloon.style.animationDuration = duration + 's';
                    
                    const pop = (e) => {
                        e.preventDefault(); 
                        if (balloon.classList.contains('popped')) return;
                        balloon.classList.add('popped');
                        balloon.innerText = '💥'; 
                        balloon.style.backgroundColor = 'transparent';
                        balloon.style.boxShadow = 'none';
                        playPopSound();
                        setTimeout(() => balloon.remove(), 300);
                    };
                    
                    balloon.addEventListener('mousedown', pop);
                    balloon.addEventListener('touchstart', pop, { passive: false });
                    document.body.appendChild(balloon);
                    
                    setTimeout(() => {
                        if (document.body.contains(balloon)) {
                            balloon.remove();
                        }
                    }, duration * 1000);
                }, Math.random() * 2000); 
            }
        }

        // 🚗 底部車子動畫特效
        function showCars() {
            // 內建的 Emoji 車輛
            const carEmojis = ['🚗', '🚕', '🚙', '🚓', '🚒', '🚑', '🚜', '🛵'];
            const numCars = 6; // 每次過關產生 6 台車

            for (let i = 0; i < numCars; i++) {
                setTimeout(() => {
                    const car = document.createElement('div');
                    car.className = 'car';
                    
                    // 隨機選一台車
                    car.innerText = carEmojis[Math.floor(Math.random() * carEmojis.length)];
                    
                    // 隨機決定要「由左至右」還是「由右至左」
                    const isMovingRight = Math.random() > 0.5;
                    const animationName = isMovingRight ? 'driveRight' : 'driveLeft';
                    
                    // 根據作業系統預設，多數車輛 Emoji 預設車頭朝左 (⬅️)
                    // 如果是由左往右開 (isMovingRight)，就透過 scaleX(-1) 將車頭水平翻轉
                    car.style.transform = isMovingRight ? 'scaleX(-1)' : 'scaleX(1)';
                    
                    // 隨機決定開車速度 (3秒 到 6秒)
                    const duration = 3 + Math.random() * 3;
                    car.style.animation = `${animationName} ${duration}s linear forwards`;
                    
                    // 隨機產生車道的高度，讓車子不會全部疊在一起 (底端往上 10px 到 50px 之間)
                    const bottomPos = 10 + Math.random() * 40;
                    car.style.bottom = bottomPos + 'px';
                    
                    document.body.appendChild(car);
                    
                    // 開出螢幕外後，自動刪除 DOM 節點清理記憶體
                    setTimeout(() => {
                        if (document.body.contains(car)) {
                            car.remove();
                        }
                    }, duration * 1000);

                }, Math.random() * 1500); // 讓車子在 1.5 秒內陸續發車
            }
        }

        function setupEvents() {
            canvas.addEventListener('mousedown', startPosition);
            canvas.addEventListener('mouseup', endPosition);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseout', endPosition);

            canvas.addEventListener('touchstart', startPosition, { passive: false });
            canvas.addEventListener('touchend', endPosition);
            canvas.addEventListener('touchmove', draw, { passive: false });

            clearBtn.addEventListener('click', resetGame);
        }

        init();
    </script>
</body>
</html>
