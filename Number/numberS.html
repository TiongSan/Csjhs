<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>數字描寫練習 (1-20 雙位數闖關版)</title>
        <style>
            body {
                font-family: "Microsoft JhengHei", sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                background-color: #f4f4f9;
                margin: 0;
                padding: 20px;
                overflow-x: hidden;
                overflow-y: auto; /* 允許垂直捲動以適應增加的按鈕 */
            }
            h1 {
                color: #333;
                margin-bottom: 5px;
            }
            #message {
                font-size: 20px;
                font-weight: bold;
                color: #ff9800;
                margin-bottom: 15px;
                height: 28px;
            }
            /* 選單容器加寬，讓 0-20 可以漂亮排版 */
            .controls {
                margin-bottom: 15px;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
                max-width: 600px;
                z-index: 10;
            }
            .num-btn {
                padding: 10px 15px;
                font-size: 18px;
                cursor: pointer;
                border: 2px solid #4caf50;
                background-color: white;
                color: #4caf50;
                border-radius: 8px;
                min-width: 45px;
            }
            .num-btn.active,
            .num-btn:hover {
                background-color: #4caf50;
                color: white;
            }

            /* 雙畫布的排列容器 */
            #boards-wrapper {
                display: flex;
                gap: 0;
                justify-content: center;
                z-index: 10;
                border: 8px solid #666;
                border-radius: 20px;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
                overflow: hidden;
                background-color: white;
                width: fit-content;
                margin: 0 auto;
            }

            /* 單一畫布的狀態樣式 */
            .canvas-wrap {
                position: relative;
                background-color: white;
                transition: all 0.3s ease;
            }

            /* 狀態 A：state-active (進行中 / 焦點) */
            .canvas-wrap.state-active {
                background-color: #ffffff;
                opacity: 1;
            }

            /* 狀態 B：state-locked (待命 / 鎖定) */
            .canvas-wrap.state-locked {
                background-color: #e0e0e0;
                opacity: 0.45;
                pointer-events: none;
            }

            /* 狀態 C：state-completed (已完成) */
            .canvas-wrap.state-completed {
                background-color: #ffffff;
                opacity: 1;
                pointer-events: none;
            }

            canvas {
                touch-action: none;
                cursor: crosshair;
                display: block;
            }

            .btn-group {
                display: flex;
                gap: 10px;
                z-index: 10;
                margin-top: 20px;
            }
            .action-btn {
                padding: 12px 24px;
                font-size: 18px;
                cursor: pointer;
                border: none;
                background-color: #ff5722;
                color: white;
                border-radius: 8px;
            }
            #soundToggle {
                background-color: #9c27b0;
            }

            /* 🎈 氣球與 🚗 車子樣式 (維持不變) */
            .balloon {
                position: fixed;
                bottom: -100px;
                width: 60px;
                height: 80px;
                border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
                cursor: pointer;
                box-shadow: inset -5px -5px 10px rgba(0, 0, 0, 0.2);
                animation: floatUp linear forwards;
                z-index: 100;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 40px;
                user-select: none;
                touch-action: manipulation;
            }
            .balloon::after {
                content: "";
                position: absolute;
                bottom: -10px;
                left: 50%;
                transform: translateX(-50%);
                border-left: 6px solid transparent;
                border-right: 6px solid transparent;
                border-bottom: 10px solid currentColor;
            }
            @keyframes floatUp {
                0% {
                    transform: translateY(0) translateX(0);
                }
                50% {
                    transform: translateY(-50vh) translateX(20px);
                }
                100% {
                    transform: translateY(-110vh) translateX(-20px);
                }
            }
            .balloon.popped::after {
                display: none;
            }
            .car {
                position: fixed;
                font-size: 50px;
                z-index: 90;
                user-select: none;
                pointer-events: none;
                white-space: nowrap;
            }
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <h1>數字練習板</h1>
        <div id="message">請點擊紫色按鈕開啟音效！</div>

        <!-- 自動產生 0-20 的按鈕 -->
        <div class="controls" id="number-selector"></div>

        <!-- 雙畫布容器 -->
        <div id="boards-wrapper">
            <div class="canvas-wrap" id="wrap0">
                <canvas id="board0" width="300" height="300"></canvas>
            </div>
            <div class="canvas-wrap" id="wrap1" style="display: none">
                <canvas id="board1" width="300" height="300"></canvas>
            </div>
        </div>

        <div class="btn-group">
            <button class="action-btn" id="clearBtn">清除重寫</button>
            <button class="action-btn" id="soundToggle">🔇 開啟音效</button>
        </div>

    <script src="script.js"></script>
    </body>
</html>
