<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5" id="themeMeta">
<title>自我挑戰</title>
<style>
:root{
  --bg:#f5f3ee;--card:#fff;--ink:#1d2233;--muted:#6b7280;--line:#e8e4db;
  --primary:#4f46e5;--primary-2:#9333ea;--primary-3:#6366f1;--primary-soft:#eef0ff;--primary-rgb:79,70,229;
  --ok:#16a34a;--ok-soft:#dcfce7;--warn:#d97706;--warn-soft:#fef3c7;
  --bad:#e11d48;--bad-soft:#ffe4e6;--unseen:#cbd5e1;
  --radius:20px;--shadow:0 1px 2px rgba(20,20,50,.04),0 10px 28px -12px rgba(20,20,50,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.65;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.muted{color:var(--muted)}.small{font-size:13px}
code{background:#efece5;padding:1px 6px;border-radius:6px;font-size:.9em;word-break:break-all}

/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:24px 22px;border-radius:26px;color:#fff;background:radial-gradient(130% 150% at 0% 0%,var(--primary-3) 0%,var(--primary) 40%,var(--primary-2) 100%);box-shadow:0 20px 40px -20px rgba(var(--primary-rgb),.75)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::before{width:240px;height:240px;right:-80px;top:-110px}
.hero::after{width:130px;height:130px;left:-50px;bottom:-70px}
.hero>*{position:relative}
.hero-text{min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;opacity:.85}
.hero h1{font-size:clamp(23px,6vw,32px);font-weight:900;line-height:1.25;margin:6px 0 8px;word-break:break-word}
.hero p{font-size:14px;opacity:.92}

/* ===== Ring ===== */
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring-bg{stroke:rgba(255,255,255,.22)}
.ring-fg{stroke:#fff;animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;text-align:center}
.ring-label b{font-size:21px;font-weight:900}
.ring-label small{font-size:11px;opacity:.85}
.ring.dark .ring-bg{stroke:#ece9e2}
.ring.dark .ring-fg{stroke:var(--primary)}
.ring.dark.good .ring-fg{stroke:var(--ok)}
.ring.dark.mid .ring-fg{stroke:var(--warn)}
.ring.dark.low .ring-fg{stroke:var(--bad)}
.ring.big{width:144px;height:144px;margin:14px auto}
.ring.big .ring-label b{font-size:34px}
.ring.big .ring-label small{font-size:14px;color:var(--muted);opacity:1}

/* ===== Stats ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 4px;text-align:center;display:flex;flex-direction:column;align-items:center}
.stat b{font-size:21px;font-weight:900;line-height:1.25}
.stat small{font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-mastered{background:var(--ok)}.d-reviewing{background:var(--warn)}.d-weak{background:var(--bad)}.d-unseen{background:var(--unseen)}
.stack{display:flex;height:10px;border-radius:99px;background:#ebe8e1;overflow:hidden;margin:12px 0 14px}
.stack i{display:block;height:100%;transition:width .6s}
.seg-mastered{background:var(--ok)}.seg-reviewing{background:var(--warn)}.seg-weak{background:var(--bad)}

/* ===== Cards ===== */
.h2{font-size:14px;font-weight:800;color:var(--muted);margin:24px 4px 10px;letter-spacing:.08em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ch-title{display:flex;gap:12px;align-items:center;min-width:0}
.ch-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--primary-soft);flex:none}
.ch-head h3{font-size:18px;font-weight:900;line-height:1.3}
.ch-pct{font-size:26px;font-weight:900;color:var(--primary);line-height:1;text-align:right;flex:none}
.ch-pct small{font-size:13px}
.ch-pct span{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}
.allcard{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,var(--primary),var(--primary-2)) border-box;border:2px solid transparent}
.weakcard{background:linear-gradient(135deg,#fff1f2 0%,#fff7ed 100%);border-color:#fecdd3}
.weakcard h3{font-size:18px;font-weight:900}
.weakcard .btn-row{margin-top:14px}
.tip{display:flex;gap:12px;align-items:flex-start;background:#fffbeb;border:1px solid #fde68a;border-radius:16px;padding:14px 16px;margin:12px 0;font-size:14px}
.tip .emo{font-size:24px;line-height:1.2}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:28px;line-height:1.9}

/* ===== Buttons ===== */
.btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-height:50px;padding:10px 14px;border-radius:14px;background:var(--primary);color:#fff;font-weight:800;font-size:16px;line-height:1.3;text-align:center;transition:transform .12s,filter .2s,opacity .2s;box-shadow:0 8px 18px -10px rgba(var(--primary-rgb),.9)}
.btn small{font-weight:600;font-size:12px;opacity:.85;margin-top:1px}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.ghost{background:var(--primary-soft);color:var(--primary);box-shadow:none}
.btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.line small{color:var(--muted);opacity:1}
.btn.rose{background:var(--bad);box-shadow:0 8px 18px -10px rgba(225,29,72,.9)}
.btn.danger{background:var(--bad);box-shadow:none}
.btn.block{width:100%}
.btn.lg{min-height:56px;font-size:17px}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px;border-radius:11px;flex-direction:row;flex:none;box-shadow:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-col{display:grid;gap:10px;margin-top:20px}
@media (hover:hover){.btn:hover:not(:disabled){filter:brightness(1.07)}.card.ch{transition:transform .2s}.card.ch:hover{transform:translateY(-2px)}}

/* ===== Topbar ===== */
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,243,238,.88);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:#fff;border:1px solid var(--line);flex:none}
.tb-mid{flex:1;min-width:0}
.tb-title{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tb-score{font-weight:800;color:var(--ok);font-size:14px;background:var(--ok-soft);padding:4px 11px;border-radius:99px;flex:none}
.bar{height:4px;background:#e6e2d9}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .4s}

/* ===== Quiz ===== */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.qmeta{margin-bottom:10px}
.chip{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--primary);background:var(--primary-soft);padding:3px 10px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.qtext{font-size:clamp(18px,4.8vw,21px);font-weight:700;line-height:1.75;white-space:pre-line}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;min-height:60px;background:var(--card);border:2px solid var(--line);border-radius:16px;font-size:17px;line-height:1.5;transition:border-color .15s,background .15s,transform .12s,opacity .2s}
.opt:active:not(:disabled){transform:scale(.985)}
.opt:disabled{cursor:default}
.letter{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:15px;background:#f1efe9;color:var(--muted);transition:.15s}
.otext{flex:1}
.omark{flex:none;font-weight:900;font-size:19px}
.opt.selected{border-color:var(--primary);background:var(--primary-soft)}
.opt.selected .letter{background:var(--primary);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .letter{background:var(--ok);color:#fff}
.opt.correct .omark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.opt.wrong .letter{background:var(--bad);color:#fff}
.opt.wrong .omark{color:var(--bad)}
.opt.dim{opacity:.45}
@media (hover:hover){.opt:not(:disabled):hover{border-color:rgba(var(--primary-rgb),.4)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fb{margin-top:14px;border-radius:18px;padding:16px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);scroll-margin-bottom:110px}
.fb.ok{background:var(--ok-soft);border:1.5px solid #86efac}
.fb.bad{background:#fff;border:1.5px solid #fda4af}
.fb-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:19px;font-weight:900;margin-bottom:4px}
.fb.ok .fb-h{color:var(--ok)}.fb.bad .fb-h{color:var(--bad)}
.streak{font-size:13px;background:#fff;color:#ea580c;padding:2px 10px;border-radius:99px}
.fb-p{font-size:15px;margin-top:4px}
.fb-tip{font-size:15px;margin-top:6px}
.fb-tip b{display:block;font-size:12px;color:var(--muted)}
.fb-row{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:9px 0;border-top:1px dashed #f5c6cf;font-size:15px}
.fb-k{font-weight:800;color:var(--muted);font-size:13px;padding-top:2px}
.fb-sub{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.actionbar{position:sticky;bottom:0;z-index:15;background:linear-gradient(to top,var(--bg) 72%,rgba(245,243,238,0));padding:16px 16px calc(14px + env(safe-area-inset-bottom))}
.actionbar .in{max-width:688px;margin:0 auto}
.enter{animation:slideIn .35s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* ===== Result / Rows ===== */
.result-head{text-align:center;padding:24px 18px}
.result-head h2{font-size:26px;font-weight:900}
.pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:700;padding:5px 12px;border-radius:99px;background:#f1efe9}
.pill.ok{background:var(--ok-soft);color:#15803d}.pill.bad{background:var(--bad-soft);color:#be123c}.pill.warn{background:var(--warn-soft);color:#b45309}
.sec-h{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:900;margin:24px 2px 10px}
.sec-h .n{font-size:13px;color:var(--muted);font-weight:700}
.srow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--unseen);margin-bottom:10px}
.srow.st-weak{border-left-color:var(--bad)}.srow.st-reviewing{border-left-color:var(--warn)}.srow.st-mastered{border-left-color:var(--ok)}
.srow-main{flex:1;min-width:0}
.srow-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.srow-name{font-weight:700;font-size:15px;line-height:1.5}
.badge{font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge.mastered{background:var(--ok-soft);color:#15803d}.badge.reviewing{background:var(--warn-soft);color:#b45309}.badge.weak{background:var(--bad-soft);color:#be123c}.badge.unseen{background:#f1f5f9;color:#64748b}
.wrongcount{font-weight:800;color:var(--bad);font-size:13px}
.arrow{color:var(--muted);font-size:12px}
.okmark{color:var(--ok);font-weight:800;font-size:14px;white-space:nowrap}
.verdict{text-align:center;padding:24px 18px}
.v-icon{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;font-size:30px;font-weight:900;color:#fff;animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
.v-ok .v-icon{background:var(--ok)}.v-warn .v-icon{background:var(--warn)}.v-bad .v-icon{background:var(--bad)}
.v-title{font-size:24px;font-weight:900}
.v-ok .v-title{color:var(--ok)}.v-warn .v-title{color:var(--warn)}.v-bad .v-title{color:var(--bad)}
.v-skill{margin:8px 0;font-weight:700;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.v-change{display:flex;justify-content:center;align-items:center;gap:6px;margin:8px 0}
.verdict>p{color:var(--muted);margin-top:6px}
.remedy{background:#f0f9ff;border:1px solid #bae6fd;border-radius:14px;padding:12px 14px;margin:14px 0;text-align:left}
.remedy b{font-size:13px;color:#0369a1}
.remedy p{font-size:15px;margin-top:2px;color:var(--ink)}
details.fold{padding:0;overflow:hidden;margin-top:16px}
details.fold>summary{padding:16px 18px;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details.fold>summary::after,details.group>summary::after{content:"▾";color:var(--muted);transition:transform .2s;margin-left:auto}
details.fold[open]>summary::after,details.group[open]>summary::after{transform:rotate(180deg)}
.fold-body{padding:0 18px 8px}
.review-item{padding:14px 0;border-top:1px solid var(--line)}
.review-item .q{font-weight:700;margin:6px 0 8px}
.ans{font-size:14px;margin:3px 0}
.ans.your{color:#be123c}.ans.right{color:#15803d;font-weight:700}.ans.note{color:var(--muted)}
details.group>summary{cursor:pointer;list-style:none}
.empty{text-align:center;padding:22px 18px}
.empty .big,.picker .big{font-size:42px;line-height:1.3}
.empty p{margin:6px 0 14px;color:var(--muted)}
.intro{text-align:center;padding:26px 20px}
.intro-badge{font-size:42px;line-height:1.2}
.intro h2{font-size:22px;font-weight:900;margin:6px 0 10px;line-height:1.4}
.intro-meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center}
.rules{list-style:none;text-align:left;background:#faf9f6;border-radius:14px;padding:12px 16px;margin:0 0 18px;font-size:14px;color:var(--muted)}
.rules li{padding:3px 0}
.rules li::before{content:"•";color:var(--primary);font-weight:900;margin-right:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools{display:flex;gap:10px;justify-content:center;margin-top:26px}

/* ===== Modal / Toast / Misc ===== */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(15,17,30,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fade .2s}
@media (min-width:600px){.modal-bg{align-items:center}}
.modal{width:100%;max-width:440px;background:#fff;border-radius:22px;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);animation:up .25s cubic-bezier(.2,.9,.3,1.1)}
.modal h3{font-size:19px;font-weight:900;margin-bottom:6px}
.modal p{color:var(--muted);font-size:15px}
.modal .acts{display:grid;gap:8px;margin-top:18px}
.modal textarea{width:100%;height:170px;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;z-index:70;animation:fade .2s;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);white-space:nowrap}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--primary-soft);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.picker{text-align:center;padding:28px 20px}
.picker h2{margin:6px 0 12px}
.picker p{margin-bottom:10px;font-size:15px}
.err{color:var(--bad);margin-top:14px;font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(760deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/*
  通用版自我診斷學習網頁
  ─────────────────────────────────────────────
  題庫選擇：
    index.html?data=physics8.json   → 讀取 physics8.json（也會找 data/physics8.json）
    index.html?data=geo8            → 自動補上 .json
    index.html                      → 讀取 questions.json 或 data/questions.json
  JSON 結構不變（chapters → sections → skills → questions），
  metadata 可選填：
    title        顯示名稱（結尾「題庫」會自動去掉），也用來產生紀錄 key
    storage_key  指定 localStorage key（例："physics8_progress"）
    theme_color  主題色（例："#0d9488"）
    icons        章節圖示陣列（例：["🗺️","🌏"]）
  題目可選填：
    explanation       答題後顯示「原因」
    shuffle_options   設為 false 時不打亂選項
*/
(function () {
  'use strict';

  /* ================= 設定 ================= */
  const DEFAULT_URLS = ['data/questions.json', 'questions.json'];
  const PREVIEW_FILE = '國中八上理化_Ch1_Ch2_每細目3題_網頁遊戲題庫.json'; // 僅供 Claude 預覽，部署時可刪除
  const CHAPTER_QUIZ_SIZE = 20;   // 章節挑戰題數
  const ALL_QUIZ_SIZE = 30;       // 綜合挑戰題數
  const WEAKNESS_QUIZ_MAX = 20;   // 弱點綜合挑戰最多細目數
  const ALL_TITLE = '全範圍綜合挑戰';
  const DEFAULT_ICONS = ['📘', '📗', '📙', '📕', '📒', '📓', '📔', '📚'];

  // 程式判斷用英文值，中文只負責顯示
  const STATUS = {
    unseen:    { label: '尚未測驗', short: '未測驗', rank: -1 },
    weak:      { label: '需要加強', short: '需加強', rank: 0 },
    reviewing: { label: '需要複習', short: '複習中', rank: 1 },
    mastered:  { label: '已掌握',   short: '已掌握', rank: 2 }
  };

  /* ================= 全域狀態 ================= */
  const bank = { meta: {}, name: '', icons: DEFAULT_ICONS, chapters: [], skills: new Map(), order: [], idx: new Map() };
  let progress = {};
  let quizState = null;
  let lastResult = null;
  let view = 'loading';
  let introSkill = null, introFrom = 'home';
  let weakFilter = 'ALL';
  let pickerError = '';
  const app = document.getElementById('app');

  let dataParam = '';
  try { dataParam = (new URLSearchParams(location.search).get('data') || '').trim(); } catch (e) {}
  if (dataParam && !/\.json$/i.test(dataParam)) dataParam += '.json';

  /* ================= 工具 ================= */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const letter = i => String.fromCharCode(65 + i);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function hash(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36); }
  const statusOf = id => { const p = progress[id]; return p && STATUS[p.status] ? p.status : 'unseen'; };
  const wrongOf = id => (progress[id] && progress[id].wrong) || 0;
  const orderIdx = id => bank.idx.has(id) ? bank.idx.get(id) : 9999;
  function countStatus(ids) { const c = { unseen: 0, weak: 0, reviewing: 0, mastered: 0 }; ids.forEach(id => c[statusOf(id)]++); return c; }
  const badge = st => `<span class="badge ${st}">${STATUS[st].label}</span>`;

  /* ================= 儲存（LocalStorage） ================= */
  const Store = {
    backend: 'memory',
    key: 'quiz_progress',
    async load(key) {
      this.key = key;
      // 在 Claude 預覽中使用 Claude 的儲存空間；部署後使用 localStorage
      if (window.storage && typeof window.storage.get === 'function') {
        this.backend = 'artifact';
        try { const r = await window.storage.get(key, false); return r && r.value ? JSON.parse(r.value) : {}; }
        catch (e) { return {}; }
      }
      let raw = null;
      try { raw = window.localStorage.getItem(key); this.backend = 'local'; }
      catch (e) { this.backend = 'memory'; return {}; }
      try { return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; }
    },
    save(data) {
      const raw = JSON.stringify(data);
      try {
        if (this.backend === 'artifact') Promise.resolve(window.storage.set(this.key, raw, false)).catch(() => {});
        else if (this.backend === 'local') window.localStorage.setItem(this.key, raw);
      } catch (e) { /* 無法寫入時仍保留在記憶體 */ }
    }
  };

  /* ================= 題庫 ================= */
  async function loadQuestionBank() {
    if (window.fs && typeof window.fs.readFile === 'function') {
      const names = (dataParam ? [dataParam] : []).concat(PREVIEW_FILE ? [PREVIEW_FILE] : []);
      for (const name of names) {
        try { const txt = await window.fs.readFile(name, { encoding: 'utf8' }); return JSON.parse(txt); } catch (e) {}
      }
    }
    const urls = dataParam ? [dataParam, 'data/' + dataParam] : DEFAULT_URLS;
    for (const url of urls) {
      try { const res = await fetch(encodeURI(url), { cache: 'no-store' }); if (res.ok) return await res.json(); } catch (e) {}
    }
    return null;
  }

  function indexBank(data) {
    if (!data || !Array.isArray(data.chapters)) throw new Error('題庫格式不正確：找不到 chapters');
    bank.meta = data.metadata || {};
    bank.chapters = []; bank.skills = new Map(); bank.order = []; bank.idx = new Map();
    data.chapters.forEach(ch => {
      const chapter = { id: ch.chapter_id, name: ch.chapter_name, skills: [] };
      (ch.sections || []).forEach(sec => {
        (sec.skills || []).forEach(sk => {
          const qs = (sk.questions || []).filter(q =>
            q && q.question && Array.isArray(q.options) && q.options.length >= 2 &&
            Number.isInteger(q.answer_index) && q.answer_index >= 0 && q.answer_index < q.options.length);
          if (!qs.length || bank.skills.has(sk.skill_id)) return;
          const skill = {
            id: sk.skill_id, name: sk.skill_name, chapterId: ch.chapter_id, chapterName: ch.chapter_name,
            sectionId: sec.section_id, sectionName: sec.section_name, questions: qs,
            remediation: (qs.find(q => q.remediation) || {}).remediation || ''
          };
          chapter.skills.push(skill);
          bank.idx.set(skill.id, bank.order.length);
          bank.skills.set(skill.id, skill);
          bank.order.push(skill.id);
        });
      });
      if (chapter.skills.length) bank.chapters.push(chapter);
    });
    if (!bank.skills.size) throw new Error('題庫中沒有可用的題目');
  }

  // 依 metadata 設定名稱、圖示、主題色
  function applyMeta() {
    const m = bank.meta;
    bank.name = String(m.title || '').replace(/\s*題庫\s*$/, '').trim() || '自我診斷測驗';
    bank.icons = Array.isArray(m.icons) && m.icons.length ? m.icons : DEFAULT_ICONS;
    document.title = bank.name + '｜自我挑戰';
    applyTheme(m.theme_color);
  }
  function applyTheme(hex) {
    if (!/^#?[0-9a-f]{6}$/i.test(String(hex || ''))) return;
    hex = String(hex).replace('#', '');
    const n = parseInt(hex, 16), rgb = [n >> 16 & 255, n >> 8 & 255, n & 255];
    const mix = (t, w) => '#' + rgb.map(c => Math.round(c + (t - c) * w).toString(16).padStart(2, '0')).join('');
    const s = document.documentElement.style;
    s.setProperty('--primary', '#' + hex);
    s.setProperty('--primary-2', mix(0, 0.35));
    s.setProperty('--primary-3', mix(255, 0.2));
    s.setProperty('--primary-soft', mix(255, 0.9));
    s.setProperty('--primary-rgb', rgb.join(','));
    const tm = document.getElementById('themeMeta');
    if (tm) tm.setAttribute('content', '#' + hex);
  }
  function storageKeyFor(meta) {
    if (meta.storage_key) return String(meta.storage_key);
    return 'quiz_' + hash(String(meta.title || bank.order.join(','))) + '_progress';
  }

  async function startApp(data) {
    indexBank(data);
    applyMeta();
    const saved = await Store.load(storageKeyFor(bank.meta));
    progress = saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
    pickerError = '';
    showView('home');
  }

  // 選項打亂：遇到「以上皆是」這類依賴順序的選項、選項本身是 A～D 代號，或題目設定 shuffle_options:false 時不打亂
  const ORDER_WORDS = /以上皆|以上都|以上均|以上各|皆是|皆非|all of the above|none of the above/i;
  const LETTER_OPT = /^[A-D]($|[\u3400-\u9fff])/;
  function keepOrder(q) {
    if (q.shuffle_options === false) return true;
    return q.options.some(o => { const s = String(o).trim(); return ORDER_WORDS.test(s) || LETTER_OPT.test(s); });
  }
  function makeInstance(q, skill) {
    const order = q.options.map((_, i) => i);
    const ord = keepOrder(q) ? order : shuffle(order);
    return {
      qid: q.question_id, skillId: skill.id, question: q.question,
      options: ord.map(i => q.options[i]),
      answerIndex: ord.indexOf(q.answer_index),
      explanation: q.explanation || '',
      remediation: q.remediation || skill.remediation || ''
    };
  }

  /* ================= 建立測驗 ================= */
  function newQuiz(mode, title, questions, meta) {
    return { mode, title, meta, questions, currentIndex: 0, answers: [], wrongSkills: {}, correctCount: 0,
      selected: null, submitted: false, submittedAt: 0, streak: 0, _fresh: true };
  }
  const scopeSkills = chId => chId === 'ALL' ? bank.order.map(id => bank.skills.get(id)) : ((bank.chapters.find(c => c.id === chId) || { skills: [] }).skills);
  const scopeName = chId => chId === 'ALL' ? ALL_TITLE : ((bank.chapters.find(c => c.id === chId) || {}).name || '');

  // 完整診斷：每個細目抽 1 題
  function createDiagnosticQuiz(chapterId) {
    const qs = scopeSkills(chapterId).map(sk => makeInstance(pick(sk.questions), sk));
    return newQuiz('diagnostic', `${scopeName(chapterId)}・完整診斷`, shuffle(qs), { kind: 'diagnostic', chapterId });
  }

  // 章節挑戰：隨機抽題（盡量讓細目分散）
  function createChapterQuiz(chapterId) {
    const size = chapterId === 'ALL' ? ALL_QUIZ_SIZE : CHAPTER_QUIZ_SIZE;
    const pools = shuffle(scopeSkills(chapterId)).map(sk => ({ sk, qs: shuffle(sk.questions) }));
    const totalQ = pools.reduce((s, p) => s + p.qs.length, 0);
    const n = Math.min(size, totalQ), out = [];
    for (let r = 0; out.length < n; r++) {
      for (const p of pools) { if (out.length >= n) break; if (r < p.qs.length) out.push(makeInstance(p.qs[r], p.sk)); }
    }
    return newQuiz('chapter', scopeName(chapterId), shuffle(out), { kind: 'chapter', chapterId });
  }

  // 單一細目挑戰：出該細目全部題目
  function createSkillQuiz(skillId) {
    const sk = bank.skills.get(skillId);
    if (!sk) return null;
    return newQuiz('skill', `細目挑戰 ${sk.id}`, shuffle(sk.questions).map(q => makeInstance(q, sk)), { kind: 'skill', skillId });
  }

  // 弱點綜合挑戰（weak 優先，其次 reviewing）
  function weakSkillIds(chapterId) {
    return bank.order.filter(id => {
      const st = statusOf(id);
      if (st !== 'weak' && st !== 'reviewing') return false;
      return !chapterId || chapterId === 'ALL' || bank.skills.get(id).chapterId === chapterId;
    }).sort((a, b) => STATUS[statusOf(a)].rank - STATUS[statusOf(b)].rank || wrongOf(b) - wrongOf(a) || orderIdx(a) - orderIdx(b));
  }
  function createWeaknessQuiz(chapterId) {
    const ids = weakSkillIds(chapterId).slice(0, WEAKNESS_QUIZ_MAX);
    if (!ids.length) return null;
    const qs = ids.map(id => { const sk = bank.skills.get(id); return makeInstance(pick(sk.questions), sk); });
    const title = !chapterId || chapterId === 'ALL' ? '弱點綜合挑戰' : `弱點綜合挑戰・${scopeName(chapterId)}`;
    return newQuiz('weakness', title, shuffle(qs), { kind: 'weakness', chapterId });
  }

  function rebuildQuiz(meta) {
    switch (meta.kind) {
      case 'diagnostic': return createDiagnosticQuiz(meta.chapterId);
      case 'chapter': return createChapterQuiz(meta.chapterId);
      case 'skill': return createSkillQuiz(meta.skillId);
      case 'weakness': return createWeaknessQuiz(meta.chapterId);
    }
    return null;
  }

  function startQuiz(q, emptyMsg) {
    if (!q || !q.questions.length) { toast(emptyMsg || '沒有可出的題目'); return; }
    quizState = q;
    showView('quiz');
  }

  /* ================= 作答 ================= */
  function selectOption(i) {
    const qs = quizState;
    if (!qs || qs.submitted) return;
    const q = qs.questions[qs.currentIndex];
    if (i < 0 || i >= q.options.length) return;
    qs.selected = i;
    app.querySelectorAll('.opt').forEach((b, j) => { b.classList.toggle('selected', j === i); b.setAttribute('aria-pressed', String(j === i)); });
    const sb = app.querySelector('[data-action="submit"]');
    if (sb) sb.disabled = false;
  }

  function checkAnswer(q, selected) { return selected === q.answerIndex; }

  function recordWrongSkill(skillId) { quizState.wrongSkills[skillId] = (quizState.wrongSkills[skillId] || 0) + 1; }

  function submitAnswer() {
    const qs = quizState;
    if (!qs || qs.submitted || qs.selected == null) return;
    const q = qs.questions[qs.currentIndex];
    const correct = checkAnswer(q, qs.selected);
    qs.submitted = true; qs.submittedAt = Date.now();
    qs.answers.push({ question_id: q.qid, skill_id: q.skillId, selected_answer: qs.selected, correct_answer: q.answerIndex, correct });
    if (correct) { qs.correctCount++; qs.streak++; }
    else { qs.streak = 0; recordWrongSkill(q.skillId); }
    renderQuestion();
  }

  function nextQuestion() {
    const qs = quizState;
    if (!qs || !qs.submitted || Date.now() - qs.submittedAt < 300) return;
    if (qs.currentIndex + 1 >= qs.questions.length) { finishQuiz(); return; }
    qs.currentIndex++; qs.selected = null; qs.submitted = false; qs._fresh = true;
    renderQuestion();
    window.scrollTo(0, 0);
  }

  function finishQuiz() {
    const qs = quizState;
    if (!qs) return;
    const answered = qs.answers.length;
    if (!answered) { quizState = null; showView('home'); return; }
    const perSkill = {};
    qs.answers.forEach(a => {
      const r = perSkill[a.skill_id] || (perSkill[a.skill_id] = { correct: 0, total: 0 });
      r.total++; if (a.correct) r.correct++;
    });
    const changes = updateSkillProgress(perSkill);
    lastResult = {
      mode: qs.mode, title: qs.title, meta: qs.meta, planned: qs.questions.length, total: answered,
      correct: qs.correctCount, wrongSkills: Object.assign({}, qs.wrongSkills),
      answers: qs.answers.slice(), questions: qs.questions.slice(0, answered), changes, celebrate: true
    };
    quizState = null;
    showView('result');
  }

  /* 更新細目狀態
     - 該細目題目全部作答：全對→mastered、錯 1 題→reviewing、其餘→weak
     - 只抽部分題目：有錯→weak；全對時，原本 unseen/mastered → mastered；
       原本 weak/reviewing → reviewing（需完成整組全對才算掌握） */
  function updateSkillProgress(perSkill) {
    const changes = {};
    Object.keys(perSkill).forEach(id => {
      const skill = bank.skills.get(id), r = perSkill[id];
      if (!skill) return;
      const prev = progress[id] || {};
      const from = statusOf(id);
      const fullSet = r.total >= skill.questions.length;
      let to;
      if (fullSet) to = r.correct === r.total ? 'mastered' : (r.correct >= r.total - 1 ? 'reviewing' : 'weak');
      else if (r.correct < r.total) to = 'weak';
      else to = (from === 'unseen' || from === 'mastered') ? 'mastered' : 'reviewing';
      progress[id] = {
        status: to,
        attempts: (prev.attempts || 0) + 1,
        correct: (prev.correct || 0) + r.correct,
        wrong: (prev.wrong || 0) + (r.total - r.correct),
        last_score: r.correct,
        last_total: r.total,
        updated_at: new Date().toISOString()
      };
      changes[id] = { from, to };
    });
    Store.save(progress);
    return changes;
  }

  /* ================= Router ================= */
  function render() {
    const views = { loading: renderLoading, picker: renderPicker, home: renderHome, quiz: renderQuestion,
      result: renderResult, weakness: renderWeakSkills, intro: renderSkillIntro };
    (views[view] || renderHome)();
  }
  function showView(v) { view = v; render(); window.scrollTo(0, 0); }

  /* ================= 共用元件 ================= */
  function ring(pct, cls, main, sub) {
    const r = 34, C = +(2 * Math.PI * r).toFixed(2), off = +(C * (1 - pct / 100)).toFixed(2);
    return `<div class="ring ${cls}"><svg viewBox="0 0 80 80" aria-hidden="true">
      <circle class="ring-bg" cx="40" cy="40" r="${r}"/>
      <circle class="ring-fg" cx="40" cy="40" r="${r}" style="stroke-dasharray:${C};stroke-dashoffset:${off};--c:${C};${pct <= 0 ? 'opacity:0' : ''}"/>
    </svg><div class="ring-label"><b>${main}</b><small>${sub}</small></div></div>`;
  }
  function stackBar(c, total) {
    const seg = k => c[k] ? `<i class="seg-${k}" style="width:${c[k] / total * 100}%"></i>` : '';
    return `<div class="stack" role="img" aria-label="已掌握 ${c.mastered}、複習中 ${c.reviewing}、需加強 ${c.weak}">${seg('mastered')}${seg('reviewing')}${seg('weak')}</div>`;
  }
  function statsRow(c) {
    return `<div class="stats">${['mastered', 'reviewing', 'weak', 'unseen'].map(k =>
      `<div class="stat"><span class="dot d-${k}"></span><b>${c[k]}</b><small>${STATUS[k].short}</small></div>`).join('')}</div>`;
  }
  function topbar(title, backAction) {
    return `<header class="topbar"><div class="topbar-in">
      <button class="icon-btn" data-action="${backAction}" aria-label="返回">←</button>
      <div class="tb-mid"><div class="tb-title">${esc(title)}</div></div>
    </div></header>`;
  }

  /* ================= Screen：載入 / 選檔 ================= */
  function renderLoading() {
    app.innerHTML = `<div class="center"><div class="spinner"></div><div>載入題庫中…</div></div>`;
  }

  function renderPicker() {
    const target = dataParam
      ? `<p>找不到 <code>${esc(dataParam)}</code>。請確認檔案放在 <code>index.html</code> 同一層或 <code>data/</code> 資料夾，且檔名大小寫一致。</p>`
      : `<p>請在網址後加上題庫檔名，例如 <code>index.html?data=geo8.json</code>；或把題庫命名為 <code>questions.json</code>，放在 <code>index.html</code> 同一層或 <code>data/</code> 資料夾。</p>`;
    app.innerHTML = `<main class="wrap"><section class="card picker">
      <div class="big">📂</div>
      <h2>找不到題庫檔案</h2>
      ${target}
      <p class="muted small">需透過網頁伺服器開啟（例如 GitHub Pages）。直接雙擊 HTML 時瀏覽器會阻擋讀檔，可用下方按鈕手動選擇。</p>
      <label class="btn block lg">選擇題庫 JSON 檔<input type="file" accept=".json,application/json" id="filePick" hidden></label>
      ${pickerError ? `<p class="err">⚠️ ${esc(pickerError)}</p>` : ''}
    </section></main>`;
    document.getElementById('filePick').addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = async () => {
        try { await startApp(JSON.parse(rd.result)); }
        catch (err) { pickerError = '無法讀取：' + err.message; view = 'picker'; renderPicker(); }
      };
      rd.readAsText(f, 'utf-8');
    });
  }

  /* ================= Screen 1：首頁 ================= */
  function chapterCard(title, sub, c, total, chId, size, diagLabel, icon, extra) {
    const pct = Math.round(c.mastered / total * 100);
    return `<section class="card ch ${extra || ''}">
      <div class="ch-head">
        <div class="ch-title"><div class="ch-icon">${esc(icon)}</div><div><h3>${esc(title)}</h3><p class="muted small">${sub}</p></div></div>
        <div class="ch-pct">${pct}<small>%</small><span>已掌握</span></div>
      </div>
      ${stackBar(c, total)}
      <div class="btn-row">
        <button class="btn" data-action="chapter" data-chapter="${esc(chId)}">開始挑戰<small>隨機 ${size} 題</small></button>
        <button class="btn ghost" data-action="diagnostic" data-chapter="${esc(chId)}">${diagLabel}<small>每細目 1 題・${total} 題</small></button>
      </div>
    </section>`;
  }

  function renderHome() {
    const ids = bank.order, total = ids.length, c = countStatus(ids);
    const tested = total - c.unseen, weakN = c.weak + c.reviewing;
    const pctM = Math.round(c.mastered / total * 100);
    const totalQ = ids.reduce((s, id) => s + bank.skills.get(id).questions.length, 0);

    const chCards = bank.chapters.map((ch, i) => {
      const cids = ch.skills.map(s => s.id);
      const qn = ch.skills.reduce((s, k) => s + k.questions.length, 0);
      return chapterCard(ch.name, `${cids.length} 個細目・${qn} 題`, countStatus(cids), cids.length, ch.id,
        Math.min(CHAPTER_QUIZ_SIZE, qn), '完整診斷', bank.icons[i % bank.icons.length]);
    }).join('');
    const allCard = bank.chapters.length >= 2
      ? `<h2 class="h2">綜合挑戰</h2>` + chapterCard(ALL_TITLE, `全部 ${total} 個細目・${totalQ} 題`, c, total, 'ALL',
          Math.min(ALL_QUIZ_SIZE, totalQ), '全面診斷', '🏆', 'allcard')
      : '';

    const weakCard = `<section class="card weakcard">
      <h3>🎯 我的弱點</h3>
      <p class="muted small">${tested ? `需要加強 ${c.weak} 個・複習中 ${c.reviewing} 個細目` : '完成診斷後，這裡會整理出你需要加強的細目'}</p>
      <div class="btn-row">
        <button class="btn rose" data-action="weakness-quiz" data-chapter="ALL" ${weakN ? '' : 'disabled'}>弱點綜合挑戰<small>${weakN ? `${Math.min(weakN, WEAKNESS_QUIZ_MAX)} 題` : '目前沒有弱點'}</small></button>
        <button class="btn line" data-action="weakness">我的弱點<small>查看學習狀況</small></button>
      </div>
    </section>`;

    const tip = tested ? '' : `<div class="tip"><span class="emo">👋</span><div><b>第一次使用？</b><br>建議先做「完整診斷」：每個細目抽 1 題，快速找出弱點，再針對弱點補強。</div></div>`;
    const note = {
      artifact: '✓ 學習紀錄會自動保存',
      local: '✓ 學習紀錄保存在這台裝置的瀏覽器中',
      memory: '⚠️ 目前環境無法保存紀錄，重新整理後會消失'
    }[Store.backend];

    app.innerHTML = `<main class="wrap home">
      <header class="hero">
        <div class="hero-text">
          <div class="eyebrow">自我挑戰</div>
          <h1>${esc(bank.name)}</h1>
          <p>答題 → 診斷 → 補救 → 再挑戰</p>
        </div>
        ${ring(pctM, '', pctM + '%', '已掌握')}
      </header>
      ${statsRow(c)}
      ${tip}
      ${tested ? weakCard : ''}
      <h2 class="h2">章節挑戰</h2>
      ${chCards}
      ${allCard}
      ${tested ? '' : weakCard}
      <footer class="foot">${note}<br>${esc(bank.meta.title || bank.name)}${bank.meta.version ? ' v' + esc(bank.meta.version) : ''}・${total} 個細目・${totalQ} 題</footer>
    </main>`;
  }

  /* ================= Screen 2：測驗 ================= */
  function renderQuestion() {
    const qs = quizState;
    if (!qs) { view = 'home'; renderHome(); return; }
    const q = qs.questions[qs.currentIndex];
    const total = qs.questions.length, n = qs.currentIndex + 1;
    const done = qs.currentIndex + (qs.submitted ? 1 : 0);

    const opts = q.options.map((o, i) => {
      let cls = 'opt', mark = '';
      if (qs.submitted) {
        if (i === q.answerIndex) { cls += ' correct'; mark = '✓'; }
        else if (i === qs.selected) { cls += ' wrong'; mark = '✗'; }
        else cls += ' dim';
      } else if (i === qs.selected) cls += ' selected';
      return `<button class="${cls}" data-action="select" data-idx="${i}" aria-pressed="${i === qs.selected}" ${qs.submitted ? 'disabled' : ''}>
        <span class="letter">${letter(i)}</span><span class="otext">${esc(o)}</span>${mark ? `<span class="omark">${mark}</span>` : ''}
      </button>`;
    }).join('');

    let fb = '';
    if (qs.submitted) {
      const skill = bank.skills.get(q.skillId);
      if (qs.selected === q.answerIndex) {
        fb = `<div class="fb ok">
          <div class="fb-h">✓ 答對了${qs.streak >= 3 ? `<span class="streak">🔥 連續答對 ${qs.streak} 題</span>` : ''}</div>
          ${q.explanation ? `<p class="fb-p">${esc(q.explanation)}</p>` : ''}
          ${q.remediation ? `<p class="fb-tip"><b>觀念重點</b>${esc(q.remediation)}</p>` : ''}
        </div>`;
      } else {
        fb = `<div class="fb bad">
          <div class="fb-h">✗ 再想一下</div>
          <div class="fb-row"><span class="fb-k">正確答案</span><span><b>${letter(q.answerIndex)}.</b> ${esc(q.options[q.answerIndex])}</span></div>
          ${q.explanation ? `<div class="fb-row"><span class="fb-k">原因</span><span>${esc(q.explanation)}</span></div>` : ''}
          <div class="fb-row"><span class="fb-k">需要複習</span><span>${esc(skill ? skill.name : q.skillId)}${q.remediation ? `<small class="fb-sub">${esc(q.remediation)}</small>` : ''}</span></div>
        </div>`;
      }
    }

    const anim = qs._fresh ? ' enter' : '';
    app.innerHTML = `
    <header class="topbar"><div class="topbar-in">
      <button class="icon-btn" data-action="quit" aria-label="離開挑戰">✕</button>
      <div class="tb-mid"><div class="tb-title">${esc(qs.title)}</div><div class="tb-sub">第 ${n} / ${total} 題</div></div>
      <div class="tb-score">✓ ${qs.correctCount}</div>
    </div><div class="bar"><i style="width:${done / total * 100}%"></i></div></header>
    <main class="wrap quiz">
      <section class="qcard${anim}">
        <div class="qmeta"><span class="chip">【細目 ${esc(q.skillId)}】</span></div>
        <p class="qtext">${esc(q.question)}</p>
      </section>
      <div class="opts${anim}">${opts}</div>
      ${fb}
    </main>
    <div class="actionbar"><div class="in">
      ${qs.submitted
        ? `<button class="btn block lg" data-action="next">${n === total ? '看結果 →' : '下一題 →'}</button>`
        : `<button class="btn block lg" data-action="submit" ${qs.selected == null ? 'disabled' : ''}>送出答案</button>`}
    </div></div>`;
    qs._fresh = false;
    if (qs.submitted) {
      const el = app.querySelector('.fb');
      if (el) requestAnimationFrame(() => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
    }
  }

  function confirmQuit() {
    const qs = quizState;
    if (!qs) { showView('home'); return; }
    const n = qs.answers.length;
    if (!n) { quizState = null; showView('home'); return; }
    openModal({
      title: '要離開這次挑戰嗎？',
      html: `<p>你已作答 ${n} / ${qs.questions.length} 題。</p>`,
      actions: [
        { label: '繼續作答' },
        { label: `結算已作答的 ${n} 題`, cls: 'ghost', onClick: () => finishQuiz() },
        { label: '放棄，不記錄', cls: 'line', onClick: () => { quizState = null; showView('home'); } }
      ]
    });
  }

  /* ================= Screen 3：測驗結果 ================= */
  function renderResult() {
    const r = lastResult;
    if (!r) { view = 'home'; renderHome(); return; }
    const pct = Math.round(r.correct / r.total * 100);
    const wrongList = Object.keys(r.wrongSkills).map(id => [id, r.wrongSkills[id]])
      .sort((a, b) => b[1] - a[1] || orderIdx(a[0]) - orderIdx(b[0]));
    const isSkill = r.mode === 'skill';
    const tone = pct >= 80 ? 'good' : pct >= 60 ? 'mid' : 'low';

    let body = '', actions = '';
    if (isSkill) {
      const id = r.meta.skillId, sk = bank.skills.get(id);
      const ch = r.changes[id] || { from: statusOf(id), to: statusOf(id) };
      const V = {
        mastered: { icon: '✓', title: '已掌握', msg: '全部答對！這個細目你已經掌握了。', cls: 'ok' },
        reviewing: { icon: '!', title: '還差一點', msg: '差一點點！再挑戰一次，全對就能掌握。', cls: 'warn' },
        weak: { icon: '✗', title: '需要再加強', msg: '先看看複習重點，再挑戰一次。', cls: 'bad' }
      }[ch.to] || { icon: '•', title: STATUS[ch.to].label, msg: '', cls: 'warn' };
      body = `<section class="card verdict v-${V.cls}">
        <div class="v-icon">${V.icon}</div>
        <div class="v-title">${V.title}</div>
        <div class="v-skill"><span class="chip">細目 ${esc(id)}</span><span>${esc(sk ? sk.name : '')}</span></div>
        ${ch.from !== ch.to ? `<div class="v-change">${badge(ch.from)}<span class="arrow">→</span>${badge(ch.to)}</div>` : ''}
        <p>${V.msg}</p>
        ${ch.to !== 'mastered' && sk && sk.remediation ? `<div class="remedy"><b>📘 複習重點</b><p>${esc(sk.remediation)}</p></div>` : ''}
      </section>`;
      const nextId = weakSkillIds('ALL').find(x => x !== id);
      actions = ch.to === 'mastered' && nextId
        ? `<button class="btn block lg" data-action="skill-intro" data-skill="${esc(nextId)}">下一個弱點：${esc(nextId)}<small>${esc(bank.skills.get(nextId).name)}</small></button>
           <button class="btn block ghost" data-action="retry">再次挑戰這個細目</button>`
        : `<button class="btn block lg" data-action="retry">再次挑戰</button>`;
    } else {
      body = `<h3 class="sec-h">需要加強的學習細目<span class="n">${wrongList.length} 個</span></h3>` +
        (wrongList.length
          ? wrongList.map(([id, n]) => {
              const sk = bank.skills.get(id), ch = r.changes[id];
              return `<div class="srow st-${ch ? ch.to : statusOf(id)}">
                <div class="srow-main"><div class="srow-top"><span class="chip">${esc(id)}</span><span class="wrongcount">錯 ${n} 題</span></div>
                <div class="srow-name">${esc(sk ? sk.name : id)}</div></div>
                <button class="btn sm" data-action="skill-intro" data-skill="${esc(id)}">再次挑戰</button>
              </div>`;
            }).join('')
          : `<div class="card empty"><div class="big">🎉</div><p>這次沒有需要加強的細目，太厲害了！</p></div>`) +
        improvedBlock(r);
      actions = `<button class="btn block lg" data-action="retry">${r.mode === 'weakness' ? '再做一次弱點挑戰' : '再挑戰一次（新題組）'}</button>`;
    }

    app.innerHTML = `${topbar(isSkill ? '細目挑戰結果' : '挑戰結果', 'home')}
    <main class="wrap">
      <section class="card result-head enter">
        <div class="muted small">${esc(r.title)}</div>
        <h2>${isSkill ? '本次結果' : '挑戰完成'}</h2>
        ${ring(pct, 'dark big ' + tone, r.correct + ' / ' + r.total, `正確率 ${pct}%`)}
        <div class="pills">
          <span class="pill ok">答對 ${r.correct}</span>
          <span class="pill bad">答錯 ${r.total - r.correct}</span>
          ${isSkill ? '' : `<span class="pill warn">需要加強 ${wrongList.length} 個細目</span>`}
        </div>
        ${r.total < r.planned ? `<p class="muted small" style="margin-top:10px">提前結束：已作答 ${r.total} / ${r.planned} 題</p>` : ''}
      </section>
      ${body}
      ${reviewBlock(r)}
      <div class="btn-col">
        ${actions}
        <div class="btn-row"><button class="btn line" data-action="weakness">我的弱點</button><button class="btn line" data-action="home">回首頁</button></div>
      </div>
    </main>`;

    if (r.celebrate) {
      r.celebrate = false;
      const mastered = isSkill && r.changes[r.meta.skillId] && r.changes[r.meta.skillId].to === 'mastered';
      if (mastered || (pct === 100 && r.total >= 3)) setTimeout(confetti, 250);
    }
  }

  function improvedBlock(r) {
    const imp = Object.keys(r.changes).filter(id => {
      const c = r.changes[id];
      return c.from !== 'unseen' && STATUS[c.to].rank > STATUS[c.from].rank;
    });
    if (!imp.length) return '';
    return `<h3 class="sec-h">🎉 進步的細目<span class="n">${imp.length} 個</span></h3>` + imp.map(id => {
      const c = r.changes[id];
      return `<div class="srow st-${c.to}"><div class="srow-main">
        <div class="srow-top"><span class="chip">${esc(id)}</span>${badge(c.from)}<span class="arrow">→</span>${badge(c.to)}</div>
        <div class="srow-name">${esc(bank.skills.get(id).name)}</div></div>
        ${c.to !== 'mastered' ? `<button class="btn sm" data-action="skill-intro" data-skill="${esc(id)}">再挑戰</button>` : '<span class="okmark">✓</span>'}
      </div>`;
    }).join('');
  }

  function reviewBlock(r) {
    const items = r.questions.map((q, i) => ({ q, a: r.answers[i] })).filter(x => x.a && !x.a.correct);
    if (!items.length) return '';
    return `<details class="card fold"><summary>📝 檢視本次錯題（${items.length}）</summary><div class="fold-body">${items.map(({ q, a }) => `
      <div class="review-item">
        <span class="chip">細目 ${esc(q.skillId)}</span>
        <p class="q">${esc(q.question)}</p>
        <div class="ans your">✗ 你的答案：${letter(a.selected_answer)}. ${esc(q.options[a.selected_answer])}</div>
        <div class="ans right">✓ 正確答案：${letter(q.answerIndex)}. ${esc(q.options[q.answerIndex])}</div>
        ${q.explanation ? `<div class="ans note">💡 ${esc(q.explanation)}</div>` : ''}
        ${q.remediation ? `<div class="ans note">📘 ${esc(q.remediation)}</div>` : ''}
      </div>`).join('')}</div></details>`;
  }

  /* ================= Screen 4：我的弱點 ================= */
  function renderWeakSkills() {
    const ids = bank.order.filter(id => weakFilter === 'ALL' || bank.skills.get(id).chapterId === weakFilter);
    const g = { weak: [], reviewing: [], mastered: [], unseen: [] };
    ids.forEach(id => g[statusOf(id)].push(id));
    const byWrong = (a, b) => wrongOf(b) - wrongOf(a) || orderIdx(a) - orderIdx(b);
    g.weak.sort(byWrong); g.reviewing.sort(byWrong);
    const c = { weak: g.weak.length, reviewing: g.reviewing.length, mastered: g.mastered.length, unseen: g.unseen.length };
    const tested = ids.length - c.unseen, weakN = c.weak + c.reviewing;

    const chips = bank.chapters.length >= 2
      ? `<div class="chips">${[['ALL', '全部']].concat(bank.chapters.map(ch => [ch.id, ch.name]))
          .map(([v, l]) => `<button class="fchip${weakFilter === v ? ' on' : ''}" data-action="filter" data-filter="${esc(v)}">${esc(l)}</button>`).join('')}</div>`
      : '';

    const row = (id, kind) => {
      const sk = bank.skills.get(id), p = progress[id];
      const info = [p && p.last_total ? `最近：${p.last_score} / ${p.last_total}` : '', p && p.wrong ? `累計錯 ${p.wrong} 題` : ''].filter(Boolean).join('・');
      const act = kind === 'mastered'
        ? `<span class="okmark">✓ 已掌握</span>`
        : `<button class="btn sm${kind === 'unseen' ? ' ghost' : ''}" data-action="skill-intro" data-skill="${esc(id)}">${kind === 'reviewing' ? '再挑戰' : '挑戰'}</button>`;
      return `<div class="srow st-${kind}"><div class="srow-main">
        <div class="srow-top"><span class="chip">${esc(id)}</span>${info ? `<span class="muted small">${info}</span>` : ''}</div>
        <div class="srow-name">${esc(sk.name)}</div></div>${act}</div>`;
    };
    const group = (kind, title, list) => list.length
      ? `<h3 class="sec-h"><span class="dot d-${kind}"></span>${title}<span class="n">${list.length}</span></h3>${list.map(id => row(id, kind)).join('')}` : '';
    const fold = (kind, title, list) => list.length
      ? `<details class="group"><summary class="sec-h"><span class="dot d-${kind}"></span>${title}<span class="n">${list.length}</span></summary>${list.map(id => row(id, kind)).join('')}</details>` : '';

    const diagCh = weakFilter === 'ALL' ? bank.chapters[0].id : weakFilter;
    let notice = '';
    if (!tested) notice = `<div class="card empty"><div class="big">🧭</div><p>還沒有測驗紀錄。<br>先做「完整診斷」，系統會幫你找出需要加強的細目。</p><button class="btn" data-action="diagnostic" data-chapter="${esc(diagCh)}">開始完整診斷</button></div>`;
    else if (!weakN) notice = `<div class="card empty"><div class="big">🎉</div><p>目前沒有需要加強的細目，繼續保持！</p></div>`;

    app.innerHTML = `${topbar('我的學習狀況', 'home')}
    <main class="wrap">
      ${chips}
      ${statsRow(c)}
      ${stackBar(c, ids.length)}
      ${weakN ? `<button class="btn block lg rose" data-action="weakness-quiz" data-chapter="${esc(weakFilter)}">🎯 弱點綜合挑戰<small>${Math.min(weakN, WEAKNESS_QUIZ_MAX)} 個細目各抽 1 題</small></button>` : ''}
      ${notice}
      ${group('weak', '需要加強', g.weak)}
      ${group('reviewing', '複習中', g.reviewing)}
      ${fold('mastered', '已掌握', g.mastered)}
      ${fold('unseen', '尚未測驗', g.unseen)}
      <div class="tools">
        <button class="btn line sm" data-action="export">📤 匯出紀錄</button>
        <button class="btn line sm" data-action="clear">🗑️ 清除紀錄</button>
      </div>
    </main>`;
  }

  /* ================= Screen 5：細目挑戰 ================= */
  function renderSkillIntro() {
    const sk = bank.skills.get(introSkill);
    if (!sk) { view = 'weakness'; renderWeakSkills(); return; }
    const p = progress[sk.id], st = statusOf(sk.id), n = sk.questions.length;
    app.innerHTML = `${topbar('弱點挑戰', 'back-intro')}
    <main class="wrap">
      <section class="card intro enter">
        <div class="intro-badge">🎯</div>
        <div class="muted small">${esc(sk.chapterName)}・${esc(sk.sectionId)} ${esc(sk.sectionName)}</div>
        <h2>${esc(sk.name)}</h2>
        <div class="intro-meta"><span class="chip">細目 ${esc(sk.id)}</span>${badge(st)}${p && p.last_total ? `<span class="muted small">最近 ${p.last_score} / ${p.last_total}</span>` : ''}</div>
        ${sk.remediation ? `<div class="remedy"><b>📘 挑戰前先複習</b><p>${esc(sk.remediation)}</p></div>` : '<div style="height:14px"></div>'}
        <ul class="rules">
          <li>共 ${n} 題，題目與選項順序隨機</li>
          <li>${n} / ${n} 全對 → 已掌握</li>
          ${n >= 2 ? `<li>${n - 1} / ${n} → 需要複習　${n >= 3 ? `0～${n - 2} / ${n}` : `0 / ${n}`} → 需要加強</li>` : ''}
        </ul>
        <button class="btn block lg" data-action="skill-start" data-skill="${esc(sk.id)}">開始挑戰（${n} 題）</button>
      </section>
    </main>`;
  }

  /* ================= 老師用：匯出 / 清除 ================= */
  function buildCSV() {
    const cell = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
    const rows = [['skill_id', 'skill_name', 'status', 'status_zh', 'last_score', 'last_total', 'attempts', 'correct', 'wrong']];
    bank.order.forEach(id => {
      const sk = bank.skills.get(id), p = progress[id] || {}, st = statusOf(id);
      rows.push([id, sk.name, st, STATUS[st].label, p.last_total ? p.last_score : '', p.last_total || '', p.attempts || 0, p.correct || 0, p.wrong || 0]);
    });
    return rows.map(r => r.map(cell).join(',')).join('\n');
  }
  function openExport() {
    const csv = buildCSV();
    openModal({
      title: '匯出學習紀錄',
      html: `<p>${esc(bank.name)}：可複製給老師，或下載 CSV 用試算表開啟。</p><textarea readonly id="exportText">${esc(csv)}</textarea>`,
      actions: [
        { label: '複製', onClick: () => { copyText(csv); return false; } },
        { label: '下載 CSV', cls: 'ghost', onClick: () => { downloadCSV(csv); return false; } },
        { label: '關閉', cls: 'line' }
      ]
    });
  }
  function copyText(t) {
    const fallback = () => {
      const ta = document.getElementById('exportText');
      if (!ta) return;
      ta.select();
      try { document.execCommand('copy'); toast('已複製'); } catch (e) { toast('請手動選取文字複製'); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('已複製'), fallback);
    else fallback();
  }
  function downloadCSV(csv) {
    try {
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = `${Store.key}_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    } catch (e) { toast('此環境無法下載，請改用複製'); }
  }
  function confirmClear() {
    openModal({
      title: '清除所有學習紀錄？',
      html: `<p>「${esc(bank.name)}」所有細目的狀態與成績都會被刪除，無法復原。其他科目的紀錄不受影響。</p>`,
      actions: [
        { label: '確定清除', cls: 'danger', onClick: () => { progress = {}; Store.save(progress); toast('已清除紀錄'); render(); } },
        { label: '取消', cls: 'line' }
      ]
    });
  }

  /* ================= Modal / Toast / Confetti ================= */
  function openModal({ title, html = '', actions = [] }) {
    closeModal();
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${html}
      <div class="acts">${actions.map((a, i) => `<button class="btn block ${a.cls || ''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div></div>`;
    bg.addEventListener('click', e => {
      if (e.target === bg) { closeModal(); return; }
      const b = e.target.closest('button[data-i]');
      if (!b) return;
      const a = actions[+b.dataset.i];
      const keep = a.onClick ? a.onClick() : undefined;
      if (keep !== false) closeModal();
    });
    document.body.appendChild(bg);
  }
  function closeModal() { document.querySelectorAll('.modal-bg').forEach(m => m.remove()); }
  function toast(msg) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }
  function confetti() {
    const colors = ['#4f46e5', '#16a34a', '#f59e0b', '#e11d48', '#06b6d4', '#a855f7'];
    const box = document.createElement('div');
    box.className = 'confetti';
    for (let i = 0; i < 44; i++) {
      const s = document.createElement('i');
      s.style.left = Math.random() * 100 + '%';
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = Math.random() * 0.5 + 's';
      s.style.animationDuration = 1.6 + Math.random() * 1.3 + 's';
      box.appendChild(s);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 3800);
  }

  /* ================= 事件 ================= */
  app.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const d = el.dataset;
    switch (d.action) {
      case 'home': showView('home'); break;
      case 'weakness': showView('weakness'); break;
      case 'diagnostic': startQuiz(createDiagnosticQuiz(d.chapter)); break;
      case 'chapter': startQuiz(createChapterQuiz(d.chapter)); break;
      case 'weakness-quiz': startQuiz(createWeaknessQuiz(d.chapter), '目前沒有需要加強的細目 🎉'); break;
      case 'skill-intro': introFrom = view; introSkill = d.skill; showView('intro'); break;
      case 'back-intro': showView(['home', 'weakness', 'result'].includes(introFrom) ? introFrom : 'home'); break;
      case 'skill-start': startQuiz(createSkillQuiz(d.skill)); break;
      case 'select': selectOption(Number(d.idx)); break;
      case 'submit': submitAnswer(); break;
      case 'next': nextQuestion(); break;
      case 'quit': confirmQuit(); break;
      case 'retry': if (lastResult) startQuiz(rebuildQuiz(lastResult.meta), '太好了，目前沒有需要加強的細目 🎉'); break;
      case 'filter': weakFilter = d.filter; renderWeakSkills(); break;
      case 'export': openExport(); break;
      case 'clear': confirmClear(); break;
    }
  });

  // 鍵盤：數字 1～9 或字母 A～Z 選答案，Enter 送出／下一題，Esc 離開
  document.addEventListener('keydown', e => {
    if (document.querySelector('.modal-bg')) { if (e.key === 'Escape') closeModal(); return; }
    if (view !== 'quiz' || !quizState || e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
    let idx = -1;
    if (/^[1-9]$/.test(e.key)) idx = Number(e.key) - 1;
    else if (/^[a-z]$/i.test(e.key)) idx = e.key.toUpperCase().charCodeAt(0) - 65;
    if (idx >= 0) { selectOption(idx); return; }
    if (e.key === 'Enter') { e.preventDefault(); if (quizState.submitted) nextQuestion(); else submitAnswer(); }
    else if (e.key === 'Escape') confirmQuit();
  });

  /* ================= 啟動 ================= */
  async function init() {
    render();
    const data = await loadQuestionBank();
    if (!data) { view = 'picker'; render(); return; }
    try { await startApp(data); }
    catch (e) { pickerError = e.message; view = 'picker'; render(); }
  }
  init();
})();
</script>
</body>
</html>
