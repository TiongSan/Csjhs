<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>台語生字描寫系統 (完整模組版)</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <!-- 🌟 更新：登入遮罩 (改為下拉選單) -->
        <div id="login-modal" class="modal-overlay">
            <div class="modal-content">
                <h2>📝 歡迎來到台語生字簿</h2>
                <select id="login-class">
                    <option value="" disabled selected>請選擇班級</option>
                    <!-- 選項會由 auth.js 自動產生 -->
                </select>
                <select id="login-number">
                    <option value="" disabled selected>請選擇座號</option>
                    <!-- 選項會由 auth.js 自動產生 -->
                </select>
                <button onclick="login()" class="btn-start">開始練習</button>
            </div>
        </div>

        <!-- 🌟 結算與 QR Code 遮罩 -->
        <div id="qrcode-modal" class="modal-overlay" style="display: none">
            <div class="modal-content">
                <h2>🎉 練習完成！</h2>
                <p>請將以下 QR Code 或紀錄碼交給老師</p>
                <div id="qrcode-box" class="qrcode-container"></div>
                <p>
                    紀錄碼：<br /><span
                        id="save-code-text"
                        class="save-code"
                    ></span>
                </p>

                <!-- 💡 新增這顆：Google 表單上傳按鈕 -->
                <button onclick="submitToGoogleForm()" class="btn-submit">
                    🚀 一鍵上傳成績
                </button>

                <button onclick="closeQRCodeModal()" class="btn-close">
                    返回繼續
                </button>
            </div>
        </div>

        <!-- ================= 原本的主畫面 ================= -->
        <h1>台語生字描寫系統</h1>

        <div class="dashboard">
            <div>進度：<span id="progress-text">0 / 0</span></div>
            <div class="score">積分：<span id="score-text">0</span></div>
            <div class="combo" id="combo-badge">
                Combo x<span id="combo-text">0</span>!
            </div>
        </div>

        <div class="main-container">
            <!-- 左側課文區 -->
            <div class="article-panel" id="article-display"></div>

            <!-- 右側畫圖區 -->
            <div class="canvas-panel">
                <div class="canvas-wrapper">
                    <canvas id="bgCanvas" width="300" height="300"></canvas>
                    <canvas id="userCanvas" width="300" height="300"></canvas>
                </div>

                <!-- 🌟 新增這段：畫筆粗細調整拉桿 -->
                <div class="brush-control">
                    <label for="brush-width"
                        >🖌️ 畫筆粗細：<span id="brush-width-val"
                            >14</span
                        ></label
                    >
                    <!-- min=5 最細, max=40 最粗, value=14 預設值 -->
                    <input
                        type="range"
                        id="brush-width"
                        min="5"
                        max="40"
                        value="20"
                        oninput="
                            document.getElementById(
                                'brush-width-val',
                            ).innerText = this.value
                        "
                    />
                </div>

                <div class="controls">
                    <button class="btn-clear" id="btn-clear">清除重寫</button>
                    <button class="btn-skip" id="btn-skip">跳過此字</button>
                    <!-- 新增一個提早結算的按鈕，方便老師看進度 -->
                    <button
                        class="btn-save"
                        id="btn-save"
                        onclick="showFinalCelebration()"
                    >
                        儲存進度
                    </button>
                </div>
                <div id="feedback-msg"></div>
            </div>
        </div>

        <!-- 隱形畫布 -->
        <canvas
            id="maskCanvas"
            width="300"
            height="300"
            style="display: none"
        ></canvas>

        <!-- ================= 載入所有的 JS 檔案 ================= -->
        <!-- 1. 載入 QR Code 外部套件 (CDN) -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <!-- 2. 載入你自己的檔案 -->
        <script src="js/data2.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/rewards.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
