<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台語生字描寫系統 (模組化MVP)</title>
    <!-- 1. 載入 CSS 樣式 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>台語生字描寫系統</h1>
    
    <div class="dashboard">
        <div>進度：<span id="progress-text">0 / 0</span></div>
        <div class="score">積分：<span id="score-text">0</span></div>
        <div class="combo" id="combo-badge">Combo x<span id="combo-text">0</span>!</div>
    </div>

    <div class="main-container">
        <!-- 左側課文區 -->
        <div class="article-panel" id="article-display"></div>

        <!-- 右側畫圖區 -->
        <div class="canvas-panel">
            <div class="canvas-wrapper">
                <canvas id="bgCanvas" width="300" height="300"></canvas>
                <canvas id="userCanvas" width="300" height="300"></canvas>
            </div>
            
            <div class="controls">
                <button class="btn-clear" id="btn-clear">清除重寫</button>
                <button class="btn-skip" id="btn-skip">跳過此字</button>
            </div>
            <div id="feedback-msg"></div>
        </div>
    </div>

    <!-- 隱形畫布：用於產生像素遮罩 -->
    <canvas id="maskCanvas" width="300" height="300" style="display:none;"></canvas>

    <!-- 2. 依序載入 JS 檔案 (順序不可對調) -->
    <script src="js/data.js"></script>
    <script src="js/rewards.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
